<title>Last Licks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,800;1,700;1,800&family=Doto:wght@700;900&family=Libre+Franklin:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Night game: a pure black page lit only by the field, a light-bulb
   scoreboard and warm-white bulbs. Serif headlines, dot-matrix numerals,
   typewriter play-by-play. Strong color is kept for the call grades. */
:root {
  color-scheme: dark;
  --bg: #000;
  --surface: #0b0b0c;
  --surface-2: #141416;
  --surface-3: #1c1c1f;
  --ink: #f2efe6;
  --muted: #9a958b;
  --dim: #66625b;
  --line: #222225;
  --line-2: #303034;
  --bulb: #fff1cf;
  --glow: rgba(255, 222, 160, .55);
  --accent: #fff1cf;
  --accent-ink: #0b0900;
  --away: #5b8ee0;
  --home: #e0604f;
  --mine: #fff1cf;
  --grass: #2e6e3b;
  --grass-far: #1e5229;
  --grass-foul: #163b20;
  --dirt: #9c6b43;
  --dirt-far: #6e4a2e;
  --chalk: #f7f4ea;
  --g-green: #3ad07e;
  --g-yellow: #ffd23f;
  --g-orange: #ff8c32;
  --g-red: #ff4f5e;
  --focus: #fff1cf;
  --series: #fff1cf;
  --hot: #ff5a3c;
  --cold: #3c8cff;
  --shadow: 0 18px 50px rgba(0, 0, 0, .65);
  --font-display: "Fraunces", "Iowan Old Style", Georgia, serif;
  --font-board: "Doto", ui-monospace, "Courier New", monospace;
  --font-body: "Libre Franklin", "Franklin Gothic Medium", "Helvetica Neue", Arial, sans-serif;
  --font-type: "Courier Prime", "Courier New", ui-monospace, monospace;
  --r: 12px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
a { color: inherit; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
select { background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 6px; color: var(--ink); }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 0 56px; }
.lit-text { color: var(--bulb); text-shadow: 0 0 8px var(--glow), 0 0 22px rgba(255, 190, 100, .2); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: #000; border-bottom: 1px solid var(--line); }
.topbar .in { max-width: 1240px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.brand .mark { width: 26px; height: 26px; flex: none; }
.brand b { font: italic 800 25px/1 var(--font-display); letter-spacing: -.01em; }
.brand span { font: 700 10.5px/1 var(--font-body); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); padding-top: 3px; }
.nav { display: flex; gap: 2px; flex-wrap: wrap; margin-left: auto; }
.nav a { text-decoration: none; padding: 8px 11px 7px; font: 700 12px/1 var(--font-body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); border-bottom: 2px solid transparent; }
.nav a:hover { color: var(--ink); }
.nav a[aria-current="page"] { color: var(--bulb); border-color: var(--bulb); }
.iconbtn { background: none; border: 1px solid var(--line-2); color: var(--ink); border-radius: 7px; min-width: 34px; height: 34px; display: inline-grid; place-items: center; padding: 0 8px; font-weight: 800; }
.iconbtn:hover { border-color: var(--muted); }
.iconbtn svg { width: 17px; height: 17px; }
.iconbtn[aria-pressed="false"] { color: var(--dim); }
.tb-tools { display: flex; gap: 6px; }
@media (max-width: 680px) {
  .topbar { position: static; }
  .topbar .in { gap: 6px 10px; padding: 10px 12px 0; }
  .brand span { display: none; }
  .tb-tools { margin-left: auto; }
  .nav { order: 3; width: 100%; margin-left: 0; flex-wrap: nowrap; overflow-x: auto; justify-content: space-between; }
  .nav a { padding: 10px 6px 9px; font-size: 11px; letter-spacing: .1em; white-space: nowrap; }
}

/* ---------- generic */
.eyebrow { font: 700 11px/1.3 var(--font-body); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.btn { border: 1px solid var(--line-2); background: var(--surface-2); border-radius: 8px; padding: 10px 15px; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; color: var(--ink); line-height: 1.2; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--bulb); border-color: var(--bulb); color: #000; box-shadow: 0 0 22px rgba(255, 225, 170, .22); }
.btn.primary:hover { box-shadow: 0 0 30px rgba(255, 225, 170, .35); }
.btn.lit { border-color: var(--bulb); box-shadow: 0 0 16px rgba(255, 225, 170, .18) inset; }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .38; cursor: not-allowed; box-shadow: none; }
.btn.small { padding: 6px 11px; font-size: 13px; border-radius: 7px; }
.btn.primary .kbd { color: rgba(0, 0, 0, .6); border-color: rgba(0, 0, 0, .25); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line-2); background: var(--surface-2); border-radius: 7px; padding: 7px 11px; font-size: 13px; font-weight: 700; text-align: left; line-height: 1.2; }
.chip small { display: block; font-weight: 500; font-size: 11.5px; color: var(--muted); margin-top: 3px; max-width: 30ch; line-height: 1.3; }
.chip .odds { font-weight: 800; color: var(--bulb); margin-left: 5px; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--ink); color: #000; border-color: var(--ink); }
.chip[aria-pressed="true"] small { color: #45423b; }
.chip[aria-pressed="true"] .odds { color: #000; }
.chip:disabled { opacity: .32; cursor: not-allowed; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.kbd { font: 700 10.5px/1 var(--font-body); border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 4px; padding: 2px 5px; color: var(--muted); }
.sq { display: inline-grid; place-items: center; width: 17px; height: 17px; border-radius: 4px; vertical-align: -3px; font: 900 11px/1 var(--font-body); color: #000; }
.sq.green { background: var(--g-green); } .sq.yellow { background: var(--g-yellow); } .sq.orange { background: var(--g-orange); } .sq.red { background: var(--g-red); }
.grade-word.green { color: var(--g-green); } .grade-word.yellow { color: var(--g-yellow); } .grade-word.orange { color: var(--g-orange); } .grade-word.red { color: var(--g-red); }
.hide { display: none !important; }
.stars { display: inline-flex; gap: 1px; color: var(--dim); font-size: 13px; letter-spacing: 0; }
.stars .on { color: var(--bulb); text-shadow: 0 0 8px var(--glow); }
.spd { display: inline-flex; align-items: center; gap: 2px; font: 800 11px/1 var(--font-body); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.spd .bolt { width: 8px; height: 11px; }
.spd.fast { color: var(--bulb); text-shadow: 0 0 6px var(--glow); }
.spd.slow { color: var(--dim); }

/* ---------- home */
.hero { margin-top: 22px; display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 880px) { .hero { grid-template-columns: minmax(0, 1fr); } }
.today { position: relative; overflow: hidden; border-radius: 16px; padding: 26px 24px 24px; border: 1px solid var(--line); background:
  radial-gradient(120% 90% at 50% -20%, rgba(255, 241, 200, .15), transparent 55%),
  radial-gradient(80% 60% at 50% 125%, rgba(46, 110, 59, .38), transparent 70%), #040404; }
.today h1 { font: 800 clamp(34px, 6vw, 62px)/1 var(--font-display); letter-spacing: -.02em; margin: 12px 0 8px; }
.today .event { font-weight: 600; color: var(--muted); }
.today .sit { display: inline-flex; align-items: center; gap: 10px; font: 900 clamp(22px, 3.4vw, 30px)/1 var(--font-board); text-transform: uppercase; margin-top: 16px; }
.today .intro { max-width: 62ch; margin: 12px 0 20px; color: #d9d5cb; }
.today .lights { position: absolute; left: 50%; top: -120px; width: 520px; height: 240px; transform: translateX(-50%); background: radial-gradient(closest-side, rgba(255, 246, 214, .2), transparent); pointer-events: none; }
.today .start { display: inline-block; font: 800 10.5px/1 var(--font-body); letter-spacing: .16em; text-transform: uppercase; padding: 5px 7px; border: 1px solid var(--bulb); color: var(--bulb); border-radius: 4px; }
.tiles { display: grid; gap: 12px; }
.tile { padding: 18px; display: grid; gap: 6px; text-decoration: none; }
.tile:hover { border-color: var(--line-2); background: var(--surface-2); }
.tile h3 { font: 800 24px/1.05 var(--font-display); letter-spacing: -.01em; }
.tile p { margin: 0; color: var(--muted); font-size: 14px; }
.section-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 34px 0 12px; flex-wrap: wrap; }
.section-h h2 { font: 800 30px/1.05 var(--font-display); letter-spacing: -.015em; }
.legend-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 10px; }
.sc-card { text-align: left; padding: 14px 15px; display: grid; gap: 5px; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); text-decoration: none; }
.sc-card:hover { border-color: var(--line-2); background: var(--surface-2); }
.sc-card .t { font: 800 19px/1.12 var(--font-display); letter-spacing: -.01em; }
.sc-card .e { font-size: 12.5px; color: var(--muted); }
.sc-card .s { font-size: 12.5px; font-weight: 600; }
.rankno { display: flex; justify-content: space-between; align-items: center; gap: 8px; font: 800 11.5px/1 var(--font-body); color: var(--muted); letter-spacing: .12em; }
.badge { display: inline-block; font: 800 10px/1 var(--font-body); letter-spacing: .12em; text-transform: uppercase; padding: 4px 6px; border-radius: 4px; background: var(--surface-3); color: var(--ink); border: 1px solid var(--line-2); }
.badge.w { background: var(--g-green); color: #00170a; border-color: transparent; } .badge.l { background: var(--g-red); color: #1d0005; border-color: transparent; }
.collections { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.coll { text-align: left; padding: 14px; display: grid; gap: 7px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); text-decoration: none; }
.coll:hover { border-color: var(--line-2); background: var(--surface-2); }
.coll b { font: 800 18px/1.1 var(--font-display); }
.coll span { font-size: 12.5px; color: var(--muted); }
.coll .prog { height: 3px; border-radius: 2px; background: var(--surface-3); overflow: hidden; }
.coll .prog i { display: block; height: 100%; background: var(--bulb); box-shadow: 0 0 8px var(--glow); }

/* ---------- archive */
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px; }
.filters input[type="search"] { flex: 1 1 220px; min-width: 0; padding: 9px 12px; border: 1px solid var(--line-2); border-radius: 7px; background: var(--surface-2); }
.filters select { padding: 9px 10px; }
.filters .chip { display: inline-flex; gap: 6px; align-items: center; }
.list { display: grid; gap: 6px; margin-top: 10px; }
.row { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 12px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; text-decoration: none; }
.row:hover { border-color: var(--line-2); background: var(--surface-2); }
.row .t { font: 800 18px/1.15 var(--font-display); letter-spacing: -.01em; }
.row .e { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.row .rk { font: 900 22px/1 var(--font-board); color: var(--dim); text-align: center; }
.row .rt { display: grid; gap: 5px; justify-items: end; }

/* ---------- pregame */
.pregame { margin-top: 22px; display: grid; gap: 16px; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); }
@media (max-width: 900px) { .pregame { grid-template-columns: minmax(0, 1fr); } }
.dugout-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.dugout { border: 1px solid var(--line-2); border-radius: 10px; padding: 12px 12px 12px 15px; text-align: left; background: var(--surface-2); display: grid; gap: 3px; position: relative; overflow: hidden; }
.dugout::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--tc, var(--line-2)); }
.dugout[aria-pressed="true"] { border-color: var(--bulb); background: var(--surface-3); box-shadow: 0 0 0 1px var(--bulb) inset; }
.dugout b { font: 800 21px/1.05 var(--font-display); }
.dugout small { color: var(--muted); }
.starts { display: grid; gap: 6px; }
.start-opt { text-align: left; border: 1px solid var(--line-2); border-radius: 9px; padding: 10px 12px; background: var(--surface-2); }
.start-opt[aria-pressed="true"] { border-color: var(--ink); background: var(--surface-3); box-shadow: inset 3px 0 0 var(--bulb); }

/* ---------- the scoreboard: a board of light bulbs */
.board { position: relative; color: var(--bulb); border-radius: 12px; padding: 12px 14px; border: 1px solid #1f1f22;
  background: radial-gradient(rgba(255, 255, 255, .05) 1px, transparent 1.5px) 0 0 / 6px 6px, linear-gradient(180deg, #0a0a0b, #050505);
  box-shadow: 0 0 0 4px #000, 0 0 50px rgba(255, 220, 160, .05), inset 0 1px 0 rgba(255, 255, 255, .05); }
.board-scroll { overflow-x: auto; scrollbar-width: thin; }
.board table { border-collapse: separate; border-spacing: 4px; margin: 0 auto 0 0; }
.board th { font: 800 11px/1 var(--font-body); letter-spacing: .12em; color: var(--dim); text-transform: uppercase; padding: 2px 0; min-width: 30px; }
.board td { font: 900 27px/1 var(--font-board); text-align: center; border-radius: 3px; min-width: 32px; height: 38px; padding: 0 3px; color: var(--bulb); text-shadow: 0 0 6px var(--glow), 0 0 16px rgba(255, 190, 100, .22);
  background: radial-gradient(rgba(255, 255, 255, .07) .9px, transparent 1.3px) 1px 1px / 5px 5px, #0c0c0d; box-shadow: inset 0 0 0 1px #19191b; }
.board td.name { text-align: left; background: none; box-shadow: none; font: 800 17px/1 var(--font-body); letter-spacing: .14em; text-transform: uppercase; padding: 0 12px 0 0; white-space: nowrap; color: var(--ink); text-shadow: none; }
.board td.name i { font-style: normal; display: inline-block; width: 5px; height: 20px; border-radius: 2px; margin-right: 10px; vertical-align: -4px; }
.board td.name .up { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--bulb); margin-left: 9px; vertical-align: 2px; box-shadow: 0 0 8px var(--bulb); }
.board td.name.me { color: var(--bulb); }
.board td.cur { box-shadow: inset 0 0 0 2px rgba(255, 241, 207, .85), 0 0 12px rgba(255, 225, 170, .25); }
.board td.rhe { background: radial-gradient(rgba(255, 255, 255, .07) .9px, transparent 1.3px) 1px 1px / 5px 5px, #121214; }
.board th.gap, .board td.gap { min-width: 4px; width: 4px; padding: 0; background: none; box-shadow: none; }
.board td.empty { color: transparent; text-shadow: none; }
.status { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255, 255, 255, .06); }
.bso { display: flex; gap: 16px; }
.bso div { display: flex; align-items: center; gap: 6px; font: 800 12px/1 var(--font-body); color: var(--muted); letter-spacing: .12em; }
.bulb { width: 14px; height: 14px; border-radius: 50%; background: #1d1d20; box-shadow: inset 0 1px 3px rgba(0, 0, 0, .9), 0 0 0 1px #2e2e33; transition: background .2s, box-shadow .2s; }
.bulb.on { background: radial-gradient(circle at 40% 35%, #fff, var(--bulb) 60%); box-shadow: 0 0 10px var(--glow), 0 0 22px rgba(255, 200, 120, .3); }
.inning-tag { font: 900 20px/1 var(--font-board); letter-spacing: .04em; text-transform: uppercase; text-shadow: 0 0 8px var(--glow); }
.count-talk { font: 700 11px/1 var(--font-body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
@media (max-width: 640px) {
  .board { padding: 10px; }
  .board td { min-width: 25px; height: 31px; font-size: 21px; }
  .board td.name { font-size: 13.5px; letter-spacing: .1em; padding-right: 6px; }
  .board td.name i { height: 16px; margin-right: 7px; }
  .status { gap: 12px; }
  .bso { gap: 12px; }
}

/* ---------- mission + win chance */
.mission { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 12px 22px; align-items: center; padding: 14px 16px; margin-top: 12px; border: 1px solid var(--line); border-radius: var(--r);
  background: linear-gradient(90deg, rgba(255, 210, 150, calc(var(--pressure, 0) * .07)), transparent 65%), var(--surface); }
@media (max-width: 760px) { .mission { grid-template-columns: minmax(0, 1fr); padding: 12px 14px; } }
.m-head { font: 800 22px/1.15 var(--font-display); letter-spacing: -.01em; }
.m-sub { color: var(--muted); font-size: 13.5px; margin-top: 3px; }
.m-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.m-tags span { font: 800 10.5px/1 var(--font-body); letter-spacing: .12em; text-transform: uppercase; padding: 5px 8px; border-radius: 4px; border: 1px solid rgba(255, 241, 207, .5); color: var(--bulb); }
.m-wp { min-width: 0; }
.m-wp .top { display: flex; align-items: center; gap: 10px; }
.m-wp .lab { font: 700 10.5px/1.25 var(--font-body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.m-wp b { font: 900 36px/1 var(--font-board); color: var(--bulb); margin-left: auto; text-shadow: 0 0 10px var(--glow); }
.m-wp .delta { font: 800 13px/1 var(--font-body); font-style: normal; padding: 4px 6px; border-radius: 4px; border: 1px solid currentColor; }
.m-wp .delta.up { color: var(--g-green); } .m-wp .delta.down { color: var(--g-red); }
.m-wp .delta.flash { animation: pop .5s ease-out; }
.wpbar { position: relative; height: 8px; border-radius: 4px; background: var(--surface-3); margin-top: 9px; overflow: hidden; }
.wpbar i { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--mine); box-shadow: 0 0 12px var(--mine); transition: width .8s cubic-bezier(.2, .8, .2, 1); }
.wpbar u { position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; background: rgba(255, 255, 255, .35); z-index: 1; }
.spark { display: block; width: 100%; height: 28px; margin-top: 6px; }
@keyframes pop { 0% { transform: scale(1.5); } 100% { transform: scale(1); } }

/* ---------- game layout */
.g-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; margin: 18px 0 12px; flex-wrap: wrap; }
.g-head h2 { font: 800 clamp(22px, 3.4vw, 32px)/1.05 var(--font-display); letter-spacing: -.015em; margin-top: 6px; }
.g-tools { display: flex; gap: 6px; flex-wrap: wrap; }
.tool { border: 1px solid var(--line-2); background: transparent; border-radius: 7px; padding: 6px 10px; font: 700 11.5px/1.2 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.tool:hover { color: var(--ink); border-color: var(--muted); }
.tool[aria-pressed="true"] { color: #000; background: var(--bulb); border-color: var(--bulb); box-shadow: 0 0 12px rgba(255, 225, 170, .25); }
.stage { display: grid; grid-template-columns: minmax(0, 1.06fr) minmax(0, 1fr); gap: 14px; margin-top: 14px; align-items: start; }
@media (max-width: 980px) {
  .stage { grid-template-columns: minmax(0, 1fr); }
  .stage .desk { order: 1; }
  .stage .field-col { order: 2; }
}
.field-col { display: grid; gap: 10px; min-width: 0; }
.bug { display: none; }
@media (max-width: 980px) {
  .bug { display: flex; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15; margin: 12px -16px 0; padding: 9px 16px; gap: 11px; align-items: center; background: rgba(0, 0, 0, .96); border-block: 1px solid var(--line); font: 700 12.5px/1 var(--font-body); white-space: nowrap; overflow: hidden; }
  .bug .b-inn, .bug b, .bug .b-count, .bug .b-wp { font: 900 16px/1 var(--font-board); color: var(--bulb); text-shadow: 0 0 6px var(--glow); }
  .bug .b-team { display: inline-flex; align-items: center; gap: 5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .bug .b-team i { width: 4px; height: 13px; border-radius: 1px; flex: none; }
  .bug .b-count { margin-left: auto; color: var(--ink); }
  .bug .b-outs { display: inline-flex; gap: 3px; }
  .bug .b-outs .bulb { width: 9px; height: 9px; }
  .stage .desk .ab { order: -1; }
}
@media (max-width: 680px) { .tool.wide { display: none; } }
@media (max-width: 640px) { .board .early { display: none; } }
